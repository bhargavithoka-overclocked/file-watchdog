[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "file-watchdog"
version = "0.1.0"
description = "Sort messy folders by file type, find duplicates, and watch folders like Downloads."
readme = "README.md"
license = "MIT"
authors = [{ name = "Bhargavi Thoka" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "watchdog>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
file-watchdog = "file_watchdog.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/file_watchdog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
